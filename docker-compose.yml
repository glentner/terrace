# S3-compatible MinIO for the sosfs integration suite (tests/tier/test_s3_integration.py).
#
# The test harness never launches a server itself: it looks for one at the
# SOSFS_TEST_MINIO_* endpoint (defaulting to this service) and skips when none is
# reachable. This file is that server, on demand:
#
#     docker compose up -d --wait     # start MinIO, block until it reports healthy
#     uv run pytest -m integration tests/tier/test_s3_integration.py
#     docker compose down             # stop and remove it
#
# Credentials and endpoint match the test defaults, so no environment variables are
# needed. Storage is ephemeral (the tests create and delete their own buckets); the
# web console is at http://localhost:9001.

services:
  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"                     # S3 API  -> SOSFS_TEST_MINIO_ENDPOINT (http://127.0.0.1:9000)
      - "9001:9001"                     # web console
    environment:
      MINIO_ROOT_USER: minioadmin       # -> SOSFS_TEST_MINIO_ACCESS_KEY
      MINIO_ROOT_PASSWORD: minioadmin   # -> SOSFS_TEST_MINIO_SECRET_KEY
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
