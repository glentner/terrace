name: CI

on:
  push:
    # main plus every {kind}/{slug} cycle branch, so a cycle's CI result can be read before it lands
    branches: [main, '*/**']
  pull_request:
  workflow_dispatch:

jobs:

  unit:
    name: Unit (Linux, ${{ matrix.python }})
    runs-on: ubuntu-latest
    # 3.15t compiles obstore from source (no free-threaded wheel yet); allow headroom
    # for a cold Rust build. uv's cache makes subsequent runs fast.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.15', '3.15t']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python }}
      # obstore ships no free-threaded (cp315t) wheel — its cp311-abi3 wheel is unusable on
      # free-threaded builds and its newest cp3XXt wheel targets 3.14t. On 3.15t, uv compiles
      # obstore from source via maturin/pyo3, which needs a Rust toolchain (verified Phase 7:
      # builds and imports GIL-disabled). Regular 3.15 uses the abi3 wheel and skips this.
      - name: Install Rust toolchain (free-threaded source build)
        if: ${{ endsWith(matrix.python, 't') }}
        uses: dtolnay/rust-toolchain@stable
      - name: Install project
        run: uv sync --locked
      # tests/fuse skips itself where libfuse cannot be loaded; this step keeps a runner that lost
      # libfuse from turning those tests into silent skips
      - name: Assert libfuse loads
        run: uv run python -c "import mfusepy"
      - name: Assert free-threading is active
        if: ${{ endsWith(matrix.python, 't') }}
        # An extension that doesn't declare free-threaded support silently re-enables the GIL
        run: uv run python -c "import sys, sosfs, obstore; assert not sys._is_gil_enabled(), 'GIL re-enabled'"
      # -rfEs keeps pytest's default FAILED and ERROR lines and adds one `SKIPPED [n] file:line: reason`
      # line per skip location, folding the n tests skipped there
      - name: Unit tests
        run: uv run pytest -n auto -m unit -rfEs

  unit-macos:
    name: Unit (macOS, engine-only)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project
        run: uv sync --locked
      - name: Unit tests
        run: uv run pytest -n auto -m unit -rfEs

  checks:
    name: Lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Lint (errors only)
        run: uvx ruff check --select E9,F63,F7,F82 src tests
      - name: Build distributions
        run: uv build
